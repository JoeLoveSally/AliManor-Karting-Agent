[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ali-manor-karting-agent"
version = "0.1.0"
description = "Visual control agent for AliManor Karting"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
hardware = [
    "pyserial>=3.5",
]
train = [
    "torch",
    "torchvision",
]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
