model:
  architecture: mobilenet_v3_small
  pretrained: true
  input_size: 224
  frame_stack: 3

train:
  batch_size: 64
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  num_workers: 0
  seed: 42

sampling:
  stable_weight: 1.0
  transition_weight: 2.0
  short_correction_weight: 3.0
  replacement: true

dataset:
  sample_fps: 30
  history_ms: 100
  frame_interval_ms: 50
  prediction_horizon_ms: 100
  transition_window_ms: 200
  short_correction_min_ms: 100
  short_correction_max_ms: 300
  clean_isolated_one_frame_glitches: true

preprocess:
  mask_touch_area: true
  touch_roi: [0.78, 0.82, 0.98, 0.98]

frame_cache:
  enabled: true
  root: data/processed/frame_cache

split:
  name: v1
  strategy: video_holdout_visual_theme_stratified
  train:
    - data/raw/video_20260130_172959.mp4
    - data/raw/video_20260130_173101.mp4
    - data/raw/video_20260130_173228.mp4
    - data/raw/video_20260130_173316.mp4
    - data/raw/video_20260130_173505.mp4
    - data/raw/video_20260130_173750.mp4
    - data/raw/video_20260130_173917.mp4
    - data/raw/video_20260130_174257.mp4
    - data/raw/video_20260130_174434.mp4
    - data/raw/video_20260130_174616.mp4
    - data/raw/video_20260130_175811.mp4
  validation:
    - data/raw/video_20260130_173545.mp4
    - data/raw/video_20260130_174012.mp4
  test:
    - data/raw/video_20260130_173426.mp4
    - data/raw/video_20260130_173835.mp4

artifact:
  name: mobilenet_v3_small_v1
