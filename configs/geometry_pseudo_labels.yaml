# Offline geometry-teacher feasibility configuration.
#
# The kart tracks are mostly piecewise straight with discrete corners. The
# teacher therefore focuses on road-axis orientation and later center-axis
# geometry, not continuous centerline curvature. OpenCV HSV uses H=[0,179],
# S/V=[0,255].
road_mask:
  # Multiple ranges are OR-ed. These are broad POC ranges for the dark/medium
  # blue, cyan/teal, green and dark-neutral track themes in the 15 recordings.
  # They still require visual audit before becoming training supervision.
  hsv_ranges:
    - lower: [103, 70, 35]
      upper: [135, 255, 210]
    - lower: [80, 70, 35]
      upper: [102, 255, 205]
    - lower: [35, 55, 30]
      upper: [85, 255, 205]
    - lower: [0, 0, 0]
      upper: [179, 110, 135]
  close_kernel: 9
  open_kernel: 3
  min_component_area_fraction: 0.01
  max_components: 4

rectilinear:
  canny_low: 40
  canny_high: 120
  hough_threshold: 24

  # Hough detects road boundaries, not the center axis. Prefer long edge
  # evidence so short road-width end caps do not dominate orientation.
  min_line_length_fraction: 0.16
  max_line_gap_fraction: 0.025
  axis_tolerance_deg: 10.0
  min_axis_separation_deg: 25.0

  # Pair two roughly parallel, overlapping road edges to infer their midpoint
  # center axis. Fractions are relative to image diagonal. These center axes are
  # still diagnostic only because current real-frame coverage is sparse.
  min_road_width_fraction: 0.025
  max_road_width_fraction: 0.22
  min_axis_overlap_fraction: 0.06

  corner_extension_fraction: 0.08
  anchor_x_norm: 0.50
  anchor_y_norm: 0.58

# v4-C1 does NOT require center-axis position. On a straight corridor, both road
# boundaries have the same axial orientation as the unseen center line. We use
# only high-confidence primary edge orientation and suppress ambiguous corner
# frames. The target is encoded as (cos 2θ, sin 2θ), so θ and θ+180° are equal.
axis_label:
  min_straight_confidence: 0.65
  max_corner_score: 0.20
  min_road_area_fraction: 0.15
  max_road_area_fraction: 0.65

# Kart-relative POC. The kart sprite uses a stable red/orange chassis across the
# current recordings. Restrict the detector to the gameplay region so progress
# UI and top-bar icons do not become pose candidates. A minimum red fraction is
# important because failure-dialog coins/buttons are warm-colored but mostly
# contain no red chassis pixels.
kart_pose:
  warm_hsv_ranges:
    - lower: [0, 120, 90]
      upper: [12, 255, 255]
    - lower: [13, 110, 100]
      upper: [35, 255, 255]
    - lower: [170, 120, 90]
      upper: [179, 255, 255]
  red_hsv_ranges:
    - lower: [0, 120, 90]
      upper: [12, 255, 255]
    - lower: [170, 120, 90]
      upper: [179, 255, 255]
  search_x_min_norm: 0.18
  search_x_max_norm: 0.92
  search_y_min_norm: 0.28
  search_y_max_norm: 0.82
  close_kernel: 5
  min_component_area_fraction: 0.00015
  max_component_area_fraction: 0.01
  min_red_fraction: 0.15
  anchor_x_norm: 0.55
  anchor_y_norm: 0.50
  anchor_distance_weight: 6.0
  join_distance_fraction: 0.075
  min_heading_quality: 0.35

# Estimate a local road relation at the kart. Do not blindly use the globally
# dominant Hough orientation near an intersection: evaluate local orientation
# clusters and prefer a plausible corridor that is close to the kart and
# compatible with the kart heading. Cross-sections are shifted along the road
# tangent so the kart sprite itself does not split the road mask. The lateral
# offset is normalized by half road width: 0=center, |1|=edge, >1=outside.
kart_relation:
  tangent_offsets_fraction: [-0.05, 0.05]
  max_normal_distance_fraction: 0.30
  min_road_width_fraction: 0.025
  max_road_width_fraction: 0.35
  local_axis_tolerance_deg: 10.0
  local_axis_radius_fraction: 0.30

# v4-C2 label gate. Keep low-confidence detections in the JSONL with weight=0
# so every v3 observation frame has an explicit record. The edge-risk target is
# deliberately "near edge" rather than off-road: expert demonstrations contain
# very few true off-road positives, so a pure off-road head would be degenerate.
kart_relative_label:
  min_confidence: 0.05
  lateral_clip_abs: 1.25
  edge_risk_threshold: 0.70

preview:
  sample_every_frames: 120
